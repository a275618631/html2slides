<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  .slide {
    width: 1280px;
    height: 720px;
    background-color: #f8fafc;
    padding: 40px;
    box-sizing: border-box;
  }
  .align-left { text-align: left; font-size: 20px; margin-bottom: 20px; }
  .align-center { text-align: center; font-size: 20px; margin-bottom: 20px; }
  .align-right { text-align: right; font-size: 20px; margin-bottom: 20px; }
  .align-justify { text-align: justify; font-size: 20px; }
</style>
</head>
<body>
<div class="slide">
  <p class="align-left">This text is Left Aligned.</p>
  <p class="align-center">This text is Center Aligned.</p>
  <p class="align-right">This text is Right Aligned.</p>
  <p class="align-justify">This text is Justified Alignment across the entire paragraph line width.</p>
</div>
</body>
</html>
