<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  .slide {
    width: 1280px;
    height: 720px;
    background-color: #ffffff;
    padding: 40px;
    box-sizing: border-box;
  }
  h1 { font-size: 32px; color: #00529b; margin-bottom: 16px; }
  p { font-size: 18px; color: #1e293b; line-height: 1.5; }
</style>
</head>
<body>
<div class="slide">
  <h1>Basic Slide Title</h1>
  <p>This is a plain paragraph demonstrating standard text extraction without complex shapes.</p>
</div>
</body>
</html>
