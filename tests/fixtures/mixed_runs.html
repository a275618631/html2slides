<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  .slide {
    width: 1280px;
    height: 720px;
    background-color: #ffffff;
    padding: 40px;
    box-sizing: border-box;
    font-size: 20px;
  }
  .bold { font-weight: bold; }
  .italic { font-style: italic; }
  .red { color: #dc2626; }
  .underline { text-decoration: underline; }
</style>
</head>
<body>
<div class="slide">
  <p>Normal <span class="bold">Bold</span> <span class="italic">Italic</span> <span class="red">Red</span> <span class="underline">Underline</span> Mixed Run Text.</p>
</div>
</body>
</html>
