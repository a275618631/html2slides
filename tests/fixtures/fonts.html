<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  .slide {
    width: 1280px;
    height: 720px;
    background-color: #ffffff;
    padding: 40px;
    box-sizing: border-box;
  }
  .font-segoe { font-family: "Segoe UI", sans-serif; font-size: 24px; margin-bottom: 20px; }
  .font-arial { font-family: Arial, sans-serif; font-size: 24px; margin-bottom: 20px; }
  .font-cjk { font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 24px; }
</style>
</head>
<body>
<div class="slide">
  <p class="font-segoe">Text rendered with Segoe UI font.</p>
  <p class="font-arial">Text rendered with Arial font.</p>
  <p class="font-cjk">繁體中文測試：智慧製造與架構思考。</p>
</div>
</body>
</html>
