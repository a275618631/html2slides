<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  .slide {
    width: 1280px;
    height: 720px;
    background-color: #f8fafc;
    padding: 40px;
    box-sizing: border-box;
    display: flex;
    gap: 20px;
  }
  .card-rect {
    width: 250px;
    height: 200px;
    background-color: #ffffff;
    border: 2px solid #cbd5e1;
    padding: 16px;
    box-sizing: border-box;
  }
  .card-rounded {
    width: 250px;
    height: 200px;
    background-color: #eef4fb;
    border: 2px solid #00529b;
    border-radius: 12px;
    padding: 16px;
    box-sizing: border-box;
  }
  .card-accent {
    width: 250px;
    height: 200px;
    background-color: #ffffff;
    border-left: 6px solid #c2410c;
    border-top: 1px solid #e2e8f0;
    border-right: 1px solid #e2e8f0;
    border-bottom: 1px solid #e2e8f0;
    padding: 16px;
    box-sizing: border-box;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="card-rect">
    <h3>Standard Rect</h3>
    <p>Square corners with border.</p>
  </div>
  <div class="card-rounded">
    <h3>Rounded Card</h3>
    <p>Rounded border with fill.</p>
  </div>
  <div class="card-accent">
    <h3>Accent Bar</h3>
    <p>Left border stripe card.</p>
  </div>
</div>
</body>
</html>
