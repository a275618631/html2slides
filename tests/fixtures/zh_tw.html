<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  .slide {
    width: 1280px;
    height: 720px;
    background-color: #f8fafc;
    padding: 50px;
    box-sizing: border-box;
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  h1 { font-size: 32px; color: #00529b; margin-bottom: 20px; }
  .card {
    background-color: #ffffff;
    border: 1.5px solid #cbd5e1;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 15px;
  }
  .card h3 { font-size: 20px; color: #1e293b; margin-bottom: 8px; }
  .card p { font-size: 16px; color: #475467; line-height: 1.6; }
</style>
</head>
<body>
<div class="slide">
  <h1>智慧製造與生產系統架構</h1>
  <div class="card">
    <h3>設備可靠度與自動化整合</h3>
    <p>確保產線 24/7 穩定運行，透過資料時序與邊界控制降低非預期停機風險。</p>
  </div>
  <div class="card">
    <h3>生產系統架構與架構思考</h3>
    <p>明確系統邊界、控制複雜度，並將驗證原則落實於真實工業現場。</p>
  </div>
</div>
</body>
</html>
